services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: osai
      POSTGRES_PASSWORD: osai
      POSTGRES_DB: osai
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports: ["6379:6379"]
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports: ["9200:9200"]
    restart: unless-stopped

  api:
    build: ./apps/api
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      elasticsearch:
        condition: service_started
    ports: ["4000:4000"]
    restart: unless-stopped

  web:
    build: ./apps/web
    env_file: .env
    depends_on: [api]
    ports: ["3000:3000"]
    restart: unless-stopped

  ai_worker:
    image: node:20-alpine
    working_dir: /app
    volumes: ["./services/ai-worker:/app"]
    command: ["node", "src/index.ts"]
    depends_on: [api]
    restart: unless-stopped

  search_worker:
    image: node:20-alpine
    working_dir: /app
    volumes: ["./services/search-worker:/app"]
    command: ["node", "src/index.ts"]
    depends_on: [api, elasticsearch]
    restart: unless-stopped

  workflow_worker:
    image: node:20-alpine
    working_dir: /app
    volumes: ["./services/workflow-worker:/app"]
    command: ["node", "src/index.ts"]
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
